name: Small-cap random 20 LightGBM test
on:
  push:
    branches: [test/lightgbm-feasibility-20261006]
    paths:
      - 'experiments/ml_feasibility/**'
      - '.github/workflows/lightgbm-feasibility.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<4' 'scikit-learn>=1.4,<2' 'lightgbm>=4,<5' 'yfinance>=0.2,<2'
      - name: Validate features and temporal split
        run: python -m unittest discover -s experiments/ml_feasibility -p 'test_*.py' -v
      - name: Draw small-cap sample and train on real daily prices
        run: python -u experiments/ml_feasibility/smallcap.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smallcap-random20-results
          path: experiments/ml_feasibility/results_smallcap/
          if-no-files-found: warn
          retention-days: 7
