# 시험용: experiments/backtest 실행 → 결과를 같은 브랜치에 커밋 (사용자 요청 2026-10-05, 실행 위치 = Actions)
name: backtest-experiment
on:
  push:
    branches: [test/backtest-sepa-buffett-bb]
    paths: ["experiments/backtest/**", "!experiments/backtest/results/**", ".github/workflows/backtest-experiment.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backtest-experiment
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: experiments/backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: SEPA 실행 확인
        continue-on-error: true  # 검산 불일치여도 백테스트는 계속, 내용은 results/sepa_screen.md
        run: python run_sepa.py --out results
      - name: 버핏 x 볼린저 백테스트
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}  # 비밀값(로그에서 가려짐) — "이름 이메일"
        run: python run_backtest.py --out results
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "시험 결과 갱신 (backtest-experiment)"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
